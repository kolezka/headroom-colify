services:
  headroom:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HEADROOM_BIND_HOST:-127.0.0.1}:8787:8787"
    environment:
      - SERVICE_FQDN_HEADROOM_8787
      - HEADROOM_PROXY_TOKEN=${SERVICE_HEX_64_HEADROOMPROXYTOKEN}
      - HEADROOM_BEACON=off
      - HEADROOM_UPDATE_CHECK=off
      - HEADROOM_TELEMETRY=off
      - HEADROOM_WORKSPACE_DIR=/home/nonroot/.headroom
      - HEADROOM_CONFIG_DIR=/home/nonroot/.headroom/config
    volumes:
      - headroom-data:/home/nonroot/.headroom
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  headroom-data:
